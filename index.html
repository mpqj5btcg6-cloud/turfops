<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1210" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>TurfOps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
:root{--bg:#0b1210;--panel:#121c19;--panel2:#182420;--line:#24332e;--text:#e8f0ec;--muted:#8aa297;--accent:#3dcc8a;--warn:#e8c36a;--bad:#ef7a6a;--ok:#3dcc8a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,sans-serif}
#app{height:100%;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0e1714;flex-wrap:wrap}
.logo{font-weight:750;color:var(--accent)}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.tool,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
nav button.active,.tool.active{background:#1d3a2e;border-color:var(--accent);color:var(--accent)}
.btn.primary{background:#1a4a34;border-color:var(--accent);color:var(--accent)}.btn.danger{color:var(--bad)}
#view-map{display:none;flex:1;min-height:0;padding:0;flex-direction:column}
#view-map.on{display:flex}
#view-map main{flex:1;min-height:0;display:flex;flex-direction:column}
#map{height:52vh;width:100%;background:#1a2a24}
aside{background:var(--panel);overflow:auto;padding:12px;flex:1}
.view{display:none;height:100%;overflow:auto;padding:16px}.view.on{display:block}
h2{margin:0 0 10px;font-size:18px}h3{margin:16px 0 8px;font-size:13px;text-transform:uppercase;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0d1613;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px}.kpi span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px}.ok{background:#163528;color:var(--ok)}.hold{background:#3a2e12;color:var(--warn)}.no{background:#3a1b18;color:var(--bad)}.hint{color:var(--muted);font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
</style></head><body>
<div id="app"><header><div class="logo">TURFOPS</div><nav>
<button data-view="map" class="active">Map</button>
<button data-view="weather">Weather</button>
<button data-view="water">Water</button>
<button data-view="feed">Fertilizer</button>
<button data-view="settings">Setup</button>
</nav></header>
<div id="view-map" class="view map on"><main><div id="map"></div><aside id="inspector">
<div class="tools"><button class="tool active" data-tool="pan">Pan</button><button class="tool" data-tool="zone">Zone</button><button class="tool" data-tool="valve">Valve</button><button class="tool" data-tool="head">Head</button></div>
<p class="hint">Tap map to place. Draw zone corners, then Finish zone.</p>
<button class="btn" id="finishZone">Finish zone</button>
<button class="btn" id="cancelDraw">Cancel draw</button>
<div id="editor"></div></aside></main></div>
<div id="view-weather" class="view"></div><div id="view-water" class="view"></div><div id="view-feed" class="view"></div><div id="view-settings" class="view"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mpqj5btcg6-cloud/turfops@main/data.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mpqj5btcg6-cloud/turfops@main/core.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mpqj5btcg6-cloud/turfops@main/ui.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mpqj5btcg6-cloud/turfops@main/more.js"></script>
</body></html>
